<div id="watermark" aria-hidden="true" hidden></div>
<div id="pill" hidden></div>
<div id="gate"><div class="g-card"><h1>MELE Reviewer</h1><p class="muted">Loading…</p></div></div>
<script src="config.js"></script>
<script type="module">
const FIREBASE_VERSION = "12.11.0";
const $ = id => document.getElementById(id);
const gate = $("gate"), pill = $("pill");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const OWNER_HINT = "ninokarl30@gmail.com";

/* ---- protection against copying and printing ---- */
const inEd = t => t && t.closest && t.closest("textarea, input");
document.addEventListener("contextmenu", e => { if (!inEd(e.target)) e.preventDefault(); });
document.addEventListener("copy", e => { if (!inEd(e.target)) e.preventDefault(); });
document.addEventListener("cut", e => { if (!inEd(e.target)) e.preventDefault(); });
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ["p", "s", "u"].includes(k)) e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && ["c", "x", "a"].includes(k) && !inEd(e.target)) e.preventDefault();
});
window.addEventListener("beforeprint", () => { document.body.style.visibility = "hidden"; });
window.addEventListener("afterprint", () => { document.body.style.visibility = ""; });
function setWatermark(text) {
  const wm = $("watermark");
  if (!text) { wm.hidden = true; return; }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190"><text x="20" y="120" transform="rotate(-24 170 95)" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1b2430">${esc(text)}</text></svg>`;
  wm.style.backgroundImage = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  wm.hidden = false;
}

function screen(html) { gate.hidden = false; gate.innerHTML = `<div class="g-card">${html}</div>`; }

let fa, au, fs, auth, db, provider, email = "", started = false;

async function init() {
  const cfg = Object.assign({}, window.FIREBASE_CONFIG || {});
  if (!cfg.apiKey) { screen(`<h1>MELE Reviewer</h1><p>config.js is missing next to this page. Upload it to the same folder.</p>`); return; }
  if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) cfg.authDomain = location.hostname;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  try { [fa, au, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]); }
  catch (e) { screen(`<h1>MELE Reviewer</h1><p>Couldn't load the sign-in library. Check your connection and reload.</p>`); return; }
  const app = fa.initializeApp(cfg);
  auth = au.getAuth(app);
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager(), cacheSizeBytes: fs.CACHE_SIZE_UNLIMITED }) }); }
  catch { db = fs.getFirestore(app); }
  window.addEventListener("pagehide", () => { try { fs.terminate(db); } catch {} });
  window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
  provider = new au.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  au.getRedirectResult(auth).catch(e => showSignIn(errText(e)));
  screen(`<h1>MELE Reviewer</h1><p class="muted">Checking sign-in…</p>`);
  au.onAuthStateChanged(auth, async user => {
    if (!user) { started = false; return showSignIn(); }
    email = (user.email || "").toLowerCase();
    screen(`<h1>MELE Reviewer</h1><p class="muted">Checking access…</p>`);
    const a = await access(email);
    if (a.unknown) { screen(`<h1>MELE Reviewer</h1><p class="err">Couldn't reach the server to check your access. Check your connection.</p><button id="g-r" class="g-btn">Try again</button>`); $("g-r").onclick = () => location.reload(); return; }
    if (!a.allowed) return denied();
    afterAccess(a);
  });
}
const errText = e => ({ "auth/unauthorized-domain": "This web address isn't authorized for sign-in yet. Add it in Firebase → Authentication → Settings → Authorized domains.", "auth/operation-not-allowed": "Google sign-in isn't turned on in Firebase yet." }[e.code] || ("Sign-in failed: " + (e.code || e.message || e)));
function showSignIn(msg) {
  screen(`<h1>MELE Reviewer</h1><p>Private question reviewer. Sign in with the Google account that was given access.</p>${msg ? `<p class="err">${esc(msg)}</p>` : ""}<button id="g-in" class="g-btn">Sign in with Google</button>`);
  $("g-in").onclick = async () => {
    try { await au.signInWithPopup(auth, provider); }
    catch (e) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) { try { await au.signInWithRedirect(auth, provider); } catch (e2) { showSignIn(errText(e2)); } }
      else if (e.code !== "auth/popup-closed-by-user") showSignIn(errText(e));
    }
  };
}
function denied() {
  screen(`<h1>No access</h1><p><b>${esc(email)}</b> isn't on the access list. Ask the owner to add this email.</p><button id="g-out" class="g-btn">Sign out</button>`);
  $("g-out").onclick = () => au.signOut(auth);
}

const okKey = e => `mele-ok:${e}`;
const readOk = e => { try { return localStorage.getItem(okKey(e)); } catch { return null; } };
const writeOk = (e, v) => { try { v ? localStorage.setItem(okKey(e), v) : localStorage.removeItem(okKey(e)); } catch {} };
const netErr = e => !e || !e.code || ["unavailable", "deadline-exceeded", "cancelled", "failed-precondition", "internal", "unknown"].includes(e.code) || navigator.onLine === false;
const withTO = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "deadline-exceeded" }), ms))]);
// Asks the server. Resolves {allowed, owner} or {unknown:true} when it can't be reached.
async function serverCheck(em) {
  let den = false;
  try { await withTO(fs.getDocsFromServer(fs.query(fs.collection(db, "allowed"), fs.limit(1))), 12000); writeOk(em, "owner"); return { allowed: true, owner: true }; }
  catch (e) { if (!netErr(e)) den = true; }
  if (den) {
    try { const s = await withTO(fs.getDocFromServer(fs.doc(db, "allowed", em)), 12000); writeOk(em, s.exists() ? "ok" : null); return { allowed: s.exists(), owner: false }; }
    catch (e) { if (!netErr(e)) { writeOk(em, null); return { allowed: false, owner: false }; } }
  }
  return { unknown: true };
}
// Known users go straight in and are re-checked in the background; new sign-ins wait for the server.
async function access(em) {
  const mem = readOk(em);
  if (mem) { const verify = serverCheck(em); verify.then(r => { if (r.allowed === false) location.reload(); }); return { allowed: true, owner: mem === "owner", offline: false }; }
  const r = await serverCheck(em);
  if (r.unknown) return { unknown: true };
  return r;
}

/* ---- content ---- */
async function fetchGroup(grp) {
  const snap = await fs.getDocs(fs.query(fs.collection(db, "appFiles"), fs.where("grp", "==", grp)));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
const b64url = (mime, b64) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return URL.createObjectURL(new Blob([u], { type: mime || "image/png" })); };

const sigOf = docs => docs.map(d => d.id + ":" + String(d.data || "").length).sort().join("|");
async function cachedGroup(grp) {
  try { const snap = await fs.getDocsFromCache(fs.query(fs.collection(db, "appFiles"), fs.where("grp", "==", grp))); return snap.docs.map(d => ({ id: d.id, ...d.data() })); }
  catch { return []; }
}
function updateBanner() {
  if ($("g-upd")) return;
  const b = document.createElement("div"); b.id = "g-upd";
  b.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;background:#1b2a3d;color:#fff;border:1px solid #6b8cff;padding:10px 14px;font:600 14px system-ui;display:flex;gap:12px;align-items:center";
  b.innerHTML = 'New content is available <button style="font:inherit;padding:6px 10px">Reload</button>';
  b.querySelector("button").onclick = () => location.reload(); document.body.appendChild(b);
}
async function afterAccess(a) {
  if (started) return;
  const cached = await cachedGroup("text");
  if (cached.length && cached.some(d => d.path === "config.js")) {
    start(a, cached);
    withTO(fs.getDocsFromServer(fs.query(fs.collection(db, "appFiles"), fs.where("grp", "==", "text"))), 30000)
      .then(snap => { if (sigOf(snap.docs.map(d => ({ id: d.id, ...d.data() }))) !== sigOf(cached)) updateBanner(); }).catch(() => {});
    return;
  }
  screen(`<h1>MELE Reviewer</h1><p class="muted">Loading questions…</p>`);
  let docs;
  try { docs = await withTO(fetchGroup("text"), 30000); }
  catch (e) { screen(`<h1>MELE Reviewer</h1><p class="err">Couldn't load the questions (${esc(e.code || e.message)}). ${a.offline ? "You're offline and they haven't been saved on this device yet. Connect once to save them." : "Check your connection and reload."}</p><button id="g-r" class="g-btn">Try again</button>`); $("g-r").onclick = () => afterAccess(a); return; }
  if (!docs.length) {
    if (a.owner) return ownerImport(a, true);
    return screen(`<h1>MELE Reviewer</h1><p>The questions haven't been uploaded yet. Try again later.</p><button id="g-out" class="g-btn">Sign out</button>`), $("g-out").onclick = () => au.signOut(auth);
  }
  start(a, docs);
}

function start(a, docs) {
  started = true;
  const byPath = new Map();
  for (const d of docs) { (byPath.get(d.path) || byPath.set(d.path, []).get(d.path)).push(d); }
  const files = {}, figs = {};
  for (const [p, parts] of byPath) {
    parts.sort((x, y) => x.i - y.i);
    if (parts[0].enc === "b64") figs["data/" + p] = b64url(parts[0].mime, parts[0].data);
    else files[p] = parts.map(x => x.data).join("");
  }
  if (!files["config.js"]) { started = false; return screen(`<h1>MELE Reviewer</h1><p class="err">The uploaded content is incomplete (config.js missing). Owner: import reviewer-content.json again.</p>`); }
  try {
    new Function(files["config.js"])();
    window.MELE_CONFIG.banks = Object.keys(files).filter(p => p.startsWith("banks/")).sort();
    window.MELE_INLINE = {};
    for (const p in files) if (p !== "config.js") window.MELE_INLINE[p] = new Function(files[p]);
    window.MELE_FIGS = figs;
    window.MELE_REFIMG = {};
  } catch (e) { started = false; return screen(`<h1>MELE Reviewer</h1><p class="err">Content error: ${esc(e.message)}</p>`); }
  window.__UID = email;
  window.__asset = async file => {
    try { const s = await fs.getDoc(fs.doc(db, "appFiles", "i__" + String(file).replace(/^.*\//, ""))); if (!s.exists()) return null; const d = s.data(); return b64url(d.mime, d.data); }
    catch { return null; }
  };
  setWatermark(email);
  $("app").hidden = false; $("app").innerHTML = "";
  gate.hidden = true;
  for (const id of ["vary-engine", "main-app"]) { const s = document.createElement("script"); s.textContent = $(id).textContent; document.body.appendChild(s); }
  showPill(a);
}

function showPill(a) {
  pill.hidden = false;
  pill.innerHTML = `<button id="p-menu" aria-label="Account">⋯</button><div id="p-pop" hidden><div class="p-mail">${esc(email)}</div><button id="p-ps">Back to Problem Sets</button><button id="p-off">Save tables for offline</button>${a.owner ? `<button id="p-src">Manage sources</button><button id="p-imp">Import / update content</button>` : ""}<button id="p-out">Sign out</button><div id="p-msg" class="p-mail"></div></div>`;
  $("p-ps").onclick = async () => { try { await Promise.race([fs.terminate(db), new Promise(r => setTimeout(r, 1500))]); } catch {} location.href = "./"; };
  $("p-menu").onclick = () => { $("p-pop").hidden = !$("p-pop").hidden; };
  $("p-off").onclick = async () => {
    const m = $("p-msg"); m.textContent = "Saving…";
    try { const r = await fetchGroup("img"); m.textContent = r.length ? `Saved ${r.length} table pages on this device.` : "No table pages were uploaded."; } catch (e) { m.textContent = "Couldn't save (" + (e.code || e.message) + ")."; }
  };
  $("p-out").onclick = () => { try { au.signOut(auth).then(() => location.reload()); } catch {} };
  if (a.owner) { $("p-imp").onclick = () => ownerImport(a, false); $("p-src").onclick = () => manageSources(a); }
}

/* ---- owner: import bundles ---- */
function ownerImport(a, first) {
  gate.hidden = false;
  screen(`<h1>Import content</h1><p>${first ? "Nothing is uploaded yet. " : ""}Choose <b>reviewer-content.json</b> and the <b>reviewer-images-*.json</b> files you were given (you can pick them all at once). Only the owner account can do this.</p>
    <input id="imp-f" type="file" accept=".json,application/json" multiple><button id="imp-go" class="g-btn">Upload</button>${first ? "" : `<button id="imp-x" class="g-btn ghost">Back</button>`}<pre id="imp-log"></pre>`);
  const log = t => { $("imp-log").textContent = t; };
  if (!first) $("imp-x").onclick = () => { if (started) { gate.hidden = true; } else location.reload(); };
  $("imp-go").onclick = async () => {
    const files = [...$("imp-f").files];
    if (!files.length) return log("Pick the .json files first.");
    $("imp-go").disabled = true;
    try {
      let total = 0;
      for (const f of files) {
        log(`Reading ${f.name}…`);
        const b = JSON.parse(await f.text());
        if (b.format !== "mele-reviewer-bundle") throw new Error(f.name + " isn't a reviewer bundle");
        let batch = fs.writeBatch(db), bytes = 0, n = 0, done = 0;
        const flush = async () => { if (n) { await batch.commit(); batch = fs.writeBatch(db); bytes = 0; n = 0; } };
        for (const d of b.docs) {
          const { id, ...rest } = d;
          const sz = (rest.data || "").length;
          if (n && (bytes + sz > 3_000_000 || n >= 20)) await flush();
          batch.set(fs.doc(db, "appFiles", id), rest); bytes += sz; n++; done++; total++;
          if (done % 5 === 0) log(`${f.name}: ${done}/${b.docs.length}`);
        }
        await flush();
        if (b.docs.some(d => d.grp === "text")) { // drop old text files that are no longer in the bundle
          const keep = new Set(b.docs.map(d => d.id));
          const old = await fs.getDocsFromServer(fs.query(fs.collection(db, "appFiles"), fs.where("grp", "==", "text")));
          const del = old.docs.filter(d => !keep.has(d.id) && !/^(banks|variants|figures)\//.test(d.data().path || ""));
          for (let i = 0; i < del.length; i += 400) { const wb = fs.writeBatch(db); del.slice(i, i + 400).forEach(d => wb.delete(d.ref)); await wb.commit(); }
        }
        log(`${f.name}: done.`);
      }
      log(`Uploaded ${total} files. Opening the reviewer…`);
      setTimeout(() => location.reload(), 900);
    } catch (e) { log("Upload failed: " + (e.code || e.message || e)); $("imp-go").disabled = false; }
  };
}


/* ---- owner: add / remove sources ---- */
async function manageSources(a) {
  screen(`<h1>Sources</h1><p class="muted">Loading…</p>`);
  let docs; try { docs = await fetchGroup("text"); } catch (e) { return screen(`<h1>Sources</h1><p class="err">${esc(e.code || e.message)}</p><button id="m-b" class="g-btn">Back</button>`), $("m-b").onclick = () => location.reload(); }
  const paths = new Map();
  for (const d of docs) if (/^(banks|variants|figures)\//.test(d.path)) paths.set(d.path, (paths.get(d.path) || 0) + 1);
  const banks = [...paths.keys()].filter(p => p.startsWith("banks/")).sort();
  const dataOf = n => String((docs.find(d => d.path === "banks/" + n) || {}).data || "");
  const subjOfFile = n => { const m = dataOf(n).match(/subject\s*:\s*["'](\w+)["']/); const v = (m ? m[1] : "").toLowerCase(), k = n.toLowerCase();
    if (/^md/.test(v) || v === "mdsp") return "MD"; if (v === "pipe") return "PIPE"; if (v === "math") return "MATH";
    if (/pipe|pump|fluid|hydraul/.test(k)) return "PIPE"; if (/math|algebra|trig|calcul|geometr|statics|dynamics/.test(k)) return "MATH"; return "MD"; };
  const srcOfFile = n => { const k = n.toLowerCase(); return /prime/.test(k) ? "Prime" : /alcorcon/.test(k) ? "Alcorcon" : /estoque/.test(k) ? "Estoque" : "Others"; };
  const rowOf = p => { const n = p.slice(6); return `<div class="m-row"><div><b>${esc(n.replace(/\.js$/, ""))}</b><div class="p-mail">${paths.has("variants/" + n) ? "has variation file" : "no variation file"}</div></div><button class="g-btn ghost m-rm" data-p="${esc(n)}">Remove</button></div>`; };
  const tree = {}; banks.forEach(p => { const n = p.slice(6), sj = subjOfFile(n), sc = srcOfFile(n); ((tree[sj] = tree[sj] || {})[sc] = tree[sj][sc] || []).push(p); });
  const rows = ["MD", "PIPE", "MATH"].map(sj => { const t = tree[sj] || {}, cnt = Object.values(t).reduce((x, l) => x + l.length, 0);
    return `<details class="m-sj"${cnt ? "" : " "}><summary><b>${sj}</b> <span class="p-mail">${cnt}</span></summary>` + (cnt ? ["Prime", "Alcorcon", "Estoque", "Others"].filter(sc => t[sc]).map(sc => `<details class="m-sc"><summary>${sc} <span class="p-mail">${t[sc].length}</span></summary>${t[sc].map(rowOf).join("")}</details>`).join("") : `<p class="muted">None yet.</p>`) + `</details>`; }).join("");
  screen(`<h1>Sources</h1><p>Add the question file for a source, and its variation file with the same name if you have one. Pictures used by questions can be added too. You can pick several files at once.</p>
    <input id="m-f" type="file" multiple><button id="m-go" class="g-btn">Add files</button>
    <h2 style="font-size:20px;margin-top:6px">Loaded sources (${banks.length})</h2>${rows || `<p class="muted">None yet.</p>`}
    <button id="m-b" class="g-btn ghost">Back</button><pre id="imp-log"></pre>`);
  const log = t => { $("imp-log").textContent = t; };
  $("m-b").onclick = () => { location.reload(); };
  document.querySelectorAll(".m-rm").forEach(b => b.onclick = async () => {
    const n = b.dataset.p;
    if (!confirm(`Remove ${n.replace(/\.js$/, "")}? Its variation file goes too.`)) return;
    try {
      for (const d of docs.filter(d => d.path === "banks/" + n || d.path === "variants/" + n)) await fs.deleteDoc(fs.doc(db, "appFiles", d.id));
      location.reload();
    } catch (e) { log("Couldn't remove: " + (e.code || e.message)); }
  });
  $("m-go").onclick = async () => {
    const files = [...$("m-f").files]; if (!files.length) return log("Pick the files first.");
    $("m-go").disabled = true;
    try {
      const jobs = [], notes = [], names = new Set(banks.map(p => p.slice(6)));
      const read = [];
      for (const f of files) {
        const name = f.name.replace(/^.*[\\/]/, "");
        if (/\.(png|jpe?g|webp)$/i.test(name)) {
          const buf = new Uint8Array(await f.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 8192) s += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
          const data = btoa(s); if (data.length > 900000) { notes.push(`${name}: picture is too large (over 650 KB). Shrink it and try again.`); continue; }
          jobs.push({ path: "figures/" + name, enc: "b64", mime: f.type || "image/png", parts: [data] }); continue;
        }
        const text = await f.text();
        try { new Function(text); } catch (e) { notes.push(`${name}: can't be read (${e.message}).`); continue; }
        if (/MELE\s*\.\s*addBank\s*\(/.test(text)) { jobs.push({ path: "banks/" + name, enc: "text", text }); names.add(name); }
        else if (/MELE\s*\.\s*addVariants\s*\(/.test(text)) read.push({ name, text });
        else notes.push(`${name}: not a question file or a variation file.`);
      }
      for (const v of read) { if (names.has(v.name)) jobs.push({ path: "variants/" + v.name, enc: "text", text: v.text }); else notes.push(`${v.name}: no question file with this name, so it was skipped.`); }
      if (!jobs.length) { log(notes.join("\n") || "Nothing to add."); $("m-go").disabled = false; return; }
      let n = 0;
      for (const j of jobs) {
        for (const d of docs.filter(d => d.path === j.path)) await fs.deleteDoc(fs.doc(db, "appFiles", d.id));
        const parts = j.parts || (j.text.match(/[\s\S]{1,600000}/g) || [""]);
        const b = fs.writeBatch(db);
        parts.forEach((p, i) => b.set(fs.doc(db, "appFiles", "t__" + j.path.replace(/\//g, "~") + "__" + String(i).padStart(3, "0")), { grp: "text", path: j.path, i, n: parts.length, enc: j.enc, ...(j.mime ? { mime: j.mime } : {}), data: p }));
        await b.commit(); n++; log(`Added ${n}/${jobs.length}…`);
      }
      log(`Added ${n} file${n === 1 ? "" : "s"}.${notes.length ? "\n" + notes.join("\n") : ""}`);
      setTimeout(() => location.reload(), notes.length ? 2500 : 900);
    } catch (e) { log("Failed: " + (e.code || e.message || e)); $("m-go").disabled = false; }
  };
}

init();
try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js"); } catch {}

</script>
