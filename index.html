<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MELE Problem Sets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!--CONFIG-->
<script src="config.js"></script>
<!--/CONFIG-->
<style>
/* Layout idea: a quiet app shell around "engineering computation pad" problem cards,
   two problems per page, each with a white solution pad you write on. */
:root {
  --paper: #ffffff;
  --desk: #eef1ee;
  --ink: #1b2430;
  --muted: #5a6573;
  --rule: #d6ddd7;
  --pad: #f1f7ee;
  --grid: #d2e3cb;
  --grid-major: #b9d2b0;
  --accent: #245c45;
  --accent-soft: #e2eee7;
  --good: #1e7a4b;
  --good-soft: #dff1e6;
  --bad: #b23b2a;
  --bad-soft: #f8e3df;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.hidden { display: none !important; }

/* protection: no selecting, no callout, no printing */
.protect, .protect * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.protect textarea, .protect input { -webkit-user-select: text; user-select: text; }
@media print {
  body > * { display: none !important; }
  body::after { content: "Printing is turned off for this review material."; display: block; padding: 40px; font: 16px sans-serif; }
}

/* generic pieces */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--paper); font-weight: 500; font-size: 15px;
}
.btn:hover { border-color: var(--grid-major); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* centred screens: sign-in, messages */
.center-screen {
  min-height: 100%; display: grid; place-items: center;
  padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
}
.panel {
  width: min(440px, 100%); background: var(--paper); border: 1px solid var(--rule);
  border-radius: 14px; padding: 28px 24px; display: grid; gap: 16px;
}
.panel h1 { font-size: 24px; line-height: 1.25; }
.panel p { margin: 0; }
.brand { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.google-btn { min-height: 48px; font-size: 16px; }
.google-btn svg { width: 20px; height: 20px; }
.note-box { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.err-box { background: var(--bad-soft); color: #6d2318; border-radius: 8px; padding: 12px 14px; font-size: 14px; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  padding: calc(8px + var(--safe-top)) 16px 8px;
}
.topbar-row { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.topbar-title { flex: 1; min-width: 0; }
.topbar-title b { display: block; font-size: 16px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 40px; height: 40px; display: inline-grid; place-items: center; flex: none;
  border-radius: 8px; border: 1px solid transparent; background: transparent;
}
.icon-btn:hover { background: var(--desk); }
.icon-btn svg { width: 22px; height: 22px; }

/* tools row */
.tools { max-width: 860px; margin: 8px auto 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tool {
  height: 36px; min-width: 36px; padding: 0 9px; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--paper);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500;
}
.tool[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.tool svg { width: 18px; height: 18px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--rule); }
.tool-sep { width: 1px; height: 24px; background: var(--rule); margin: 0 2px; }
.tools .grow { flex: 1; }

/* home */
.home { max-width: 860px; margin: 0 auto; padding: 20px 16px calc(32px + var(--safe-bottom)); display: grid; gap: 18px; }
.home h2 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.exam-list { display: grid; gap: 12px; }
.exam-card {
  text-align: left; width: 100%; background: var(--paper); border: 1px solid var(--rule);
  border-left: 5px solid var(--accent); border-radius: var(--radius); padding: 16px 18px;
  display: grid; gap: 6px;
}
.exam-card:hover { border-color: var(--grid-major); border-left-color: var(--accent); }
.exam-card h3 { font-size: 19px; line-height: 1.3; }
.exam-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.progress { height: 6px; border-radius: 3px; background: var(--desk); overflow: hidden; margin-top: 4px; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; }
.banner { background: #fff7e0; border: 1px solid #ecd58f; color: #5b4500; border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }

/* exam view */
.sections { max-width: 860px; margin: 14px auto 0; padding: 0 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.sections::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 14px; font-weight: 500;
}
.chip .mono { font-size: 12px; color: var(--muted); }
.chip[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-current="true"] .mono { color: #c9d1da; }

.page { max-width: 860px; margin: 0 auto; padding: 14px 16px calc(96px + var(--safe-bottom)); display: grid; gap: 18px; }
.problem { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 18px 16px; display: grid; gap: 14px; }
.problem-head { display: flex; align-items: center; gap: 12px; }
.qnum {
  font-family: var(--font-mono); font-weight: 600; font-size: 15px; min-width: 40px; height: 32px; padding: 0 8px;
  border-radius: 6px; background: var(--ink); color: #fff; display: inline-grid; place-items: center;
}
.qsec { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.q-stick { display: grid; gap: 14px; background: var(--paper); }
.q-stick.pinned { position: sticky; top: var(--topbar-h, 96px); z-index: 20; max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  margin: 0 -18px; padding: 10px 18px 12px; border-bottom: 2px solid var(--accent); box-shadow: 0 6px 14px -8px rgba(0,0,0,.28); }
.pin-btn { margin-left: auto; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper);
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
.pin-btn svg { width: 16px; height: 16px; }
.pin-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.qtext { font-size: 17px; line-height: 1.6; max-width: 70ch; }
.qnote { font-size: 15px; font-style: italic; color: var(--muted); border-left: 3px solid var(--grid-major); padding-left: 10px; }
sup, sub { font-size: .72em; line-height: 0; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choices.long { grid-template-columns: 1fr; }
.choice {
  display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 10px 12px; min-height: 46px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); font-size: 16px; line-height: 1.45;
}
.choice .letter { font-family: var(--font-mono); font-weight: 600; width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--desk); font-size: 14px; }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice[aria-pressed="true"] .letter { background: var(--ink); color: #fff; }
.choice.is-correct { border-color: var(--good); background: var(--good-soft); box-shadow: inset 0 0 0 1px var(--good); }
.choice.is-correct .letter { background: var(--good); color: #fff; }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 0 0 0 1px var(--bad); }
.choice.is-wrong .letter { background: var(--bad); color: #fff; }
.answer-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.answer-tag { font-family: var(--font-mono); font-weight: 600; font-size: 15px; padding: 6px 12px; border-radius: 6px; background: var(--good-soft); color: var(--good); }
.verdict { font-size: 14px; font-weight: 500; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

/* solution pad */
.pad-wrap { display: grid; gap: 8px; }
.pad-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pad-label b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.pad-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pad {
  position: relative; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  background: #ffffff;
  touch-action: pan-y pinch-zoom;
}
.pad.writing { touch-action: none; }
.pad canvas { display: block; width: 100%; height: 100%; }
.pad-hint { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: #9aa3ae; pointer-events: none; }
.typed summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 0; }
.typed textarea {
  width: 100%; min-height: 110px; resize: vertical; margin-top: 6px; padding: 10px 12px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); font-size: 16px; line-height: 1.5;
}

/* home: search, subjects, sources, progress */
.search { position: relative; }
.search input {
  width: 100%; height: 48px; padding: 0 46px 0 44px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--paper); font-size: 16px; -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search-icon { position: absolute; left: 13px; top: 13px; width: 22px; height: 22px; color: var(--muted); pointer-events: none; }
.search-icon svg { width: 22px; height: 22px; }
.search-clear { position: absolute; right: 4px; top: 4px; }
.browse, .results { display: grid; gap: 18px; }
.results { gap: 10px; }
.subject-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.subject-tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; display: inline-flex; align-items: baseline; gap: 8px; padding: 9px 16px; min-height: 42px;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-weight: 600; font-size: 15px;
}
.tab .mono { font-size: 12px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.tab[aria-selected="true"] .mono { color: #c9d1da; }
.summary { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.summary-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.summary-head h3 { font-size: 18px; line-height: 1.3; margin-top: 2px; }
.source-group { display: grid; gap: 10px; }
.source-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.source-head .mono { font-size: 13px; }
.source-toggle {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
}
.seg-btn {
  min-height: 40px; padding: 6px 4px; border: 0; border-radius: 7px; background: transparent;
  display: inline-flex; align-items: baseline; justify-content: center; gap: 5px; font-size: 14px; font-weight: 600; color: var(--muted);
  white-space: nowrap;
}
.seg-btn .mono { font-size: 12px; font-weight: 500; }
.seg-btn:hover { background: var(--desk); }
.seg-btn[aria-selected="true"] { background: var(--accent); color: #fff; }
.seg-btn[aria-selected="true"] .mono { color: #d3e6dc; }
.source-sum-text { flex: 1; min-width: 0; display: grid; gap: 6px; }
.source-sum-text b { font-size: 15px; }
.source-sum { align-items: flex-end; }
.source-sum .pbar { background: #dbe2dc; }

.pview { display: grid; gap: 6px; }
.pbar { display: flex; height: 8px; border-radius: 4px; background: var(--desk); overflow: hidden; }
.pbar i { display: block; height: 100%; }
.p-right { background: var(--good); }
.p-wrong { background: var(--bad); }
.p-done { background: #8d98a5; }
.ptext { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ptext b { color: var(--ink); font-weight: 600; }
.t-right { color: var(--good); }
.t-wrong { color: var(--bad); }
.exam-card { position: relative; }
.exam-open { all: unset; cursor: pointer; display: block; }
.exam-open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.exam-open:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.on-top { position: relative; z-index: 1; }
.card-foot, .source-sum { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.card-foot .pview, .source-sum .pview { flex: 1; min-width: 0; }
.card-foot .btn, .source-sum .btn { flex: none; }
.result {
  text-align: left; width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  padding: 12px 14px; display: grid; gap: 4px;
}
.result:hover { border-color: var(--grid-major); }
.result-where { font-size: 13px; color: var(--muted); }
.result-where b { color: var(--ink); font-family: var(--font-mono); }
.result-text { font-size: 15px; line-height: 1.5; }
mark { background: #ffe9a8; color: inherit; border-radius: 2px; padding: 0 1px; }
.exam-progress { max-width: 860px; margin: 10px auto 0; padding: 0 16px; }
.problem.flash { box-shadow: 0 0 0 3px var(--accent); }
@media (prefers-reduced-motion: no-preference) { .problem { transition: box-shadow .6s; } }

/* clear progress */
.ctree { display: grid; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--paper); }
.ct-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--rule); cursor: pointer; min-height: 48px; }
.ct-row:first-child { border-top: 0; }
.ct-row input, .opt-row input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
.ct-row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ct-row[data-depth="0"] { font-weight: 600; }
.ct-row[data-depth="1"] { padding-left: 38px; }
.ct-row[data-depth="2"] { padding-left: 62px; }
.ct-row[data-depth="3"] { padding-left: 86px; color: var(--muted); }
.ct-all { background: var(--desk); }
.ct-count { font-size: 13px; color: var(--muted); flex: none; }
.opt-row { display: flex; gap: 12px; align-items: flex-start; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; cursor: pointer; }
.opt-row input { margin-top: 2px; }
.clear-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-exam { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--rule); }
.admin-exam:first-child { border-top: 0; }
.admin-exam-top { display: flex; gap: 10px; align-items: flex-start; }
.admin-exam-top .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.admin-exam-top small { display: block; color: var(--muted); }
.rename-row { display: flex; gap: 8px; }
.rename-in { flex: 1; min-width: 0; height: 38px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); padding: 0 10px; font-size: 16px; color: var(--ink); }
.admin-exam-sel { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-exam-sel label { display: grid; gap: 2px; font-size: 13px; color: var(--muted); }
.admin-exam-sel select { height: 38px; min-width: 120px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); padding: 0 8px; font-size: 15px; color: var(--ink); }
@media (max-width: 560px) {
  .ct-row[data-depth="1"] { padding-left: 30px; }
  .ct-row[data-depth="2"] { padding-left: 46px; }
  .ct-row[data-depth="3"] { padding-left: 62px; }
}

/* tools: size slider, selection bar */
.size-ctl { height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 4px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.size-dot-wrap { width: 30px; height: 30px; display: grid; place-items: center; flex: none; }
.size-dot { display: block; border-radius: 50%; background: var(--ink); }
.size-ctl input[type="range"] { width: 112px; accent-color: var(--accent); }
.seg { display: inline-flex; gap: 6px; }
.pad .fx { position: absolute; inset: 0; pointer-events: none; }
.sel-bar { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 6px; }

/* pager */
.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--paper) 95%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--rule); padding: 10px 16px calc(10px + var(--safe-bottom));
}
.pager-row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.pager select {
  flex: 1; min-width: 0; height: 44px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper);
  padding: 0 10px; font-size: 15px;
}
.pager .btn { min-height: 44px; min-width: 88px; }

/* admin */
.admin-block { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.admin-block h3 { font-size: 18px; }
.admin-block textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; font-size: 16px; resize: vertical; }
.rows { display: grid; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--rule); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row small { display: block; color: var(--muted); }
.empty { padding: 14px 12px; color: var(--muted); font-size: 14px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* watermark */
.watermark { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: .09; background-repeat: repeat; }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + var(--safe-bottom)); z-index: 50;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px);
}

@media (max-width: 560px) {
  .choices { grid-template-columns: 1fr; }
  .problem { padding: 16px 14px 14px; }
  .qtext { font-size: 16px; }
  .tool-label { display: none; }
  .pager .btn { min-width: 64px; padding: 8px 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .choice, .tool, .btn { transition: background-color .15s, border-color .15s, color .15s; }
}
</style>
</head>
<body>
<div id="app" class="protect"></div>
<div id="watermark" class="watermark hidden" aria-hidden="true"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="module">
/* ============================================================
   MELE Problem Sets — review viewer
   Modes: "firebase" (Google sign-in + email list) or "preview"

/* ---------- local storage of each person's work (IndexedDB, falls back to memory) ---------- */
const store = (() => {
  const mem = new Map();
  const gone = new Set();
  const pending = new Map();           // writes that did not reach the device yet
  let dbp = null;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open("mele-review", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("work");
    r.onsuccess = () => { const d = r.result; d.onclose = () => { dbp = null; }; d.onversionchange = () => { d.close(); dbp = null; }; res(d); };
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error("blocked"));
  });
  const getDb = () => { if (!dbp) { try { dbp = open().catch(() => { dbp = null; return null; }); } catch { dbp = Promise.resolve(null); } } return dbp; };
  const once = async (mode, fn) => {
    const db = await getDb();
    if (!db) throw new Error("nodb");
    return new Promise((res, rej) => {
      const t = db.transaction("work", mode);
      const out = fn(t.objectStore("work"));
      t.oncomplete = () => res(out && "result" in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error("abort"));
    });
  };
  // Safari can drop the database connection while the page sits in the background. Reopen and try again.
  async function tx(mode, fn) {
    try { return await once(mode, fn); }
    catch { dbp = null; try { return await once(mode, fn); } catch { dbp = null; return null; } }
  }
  const warn = on => {
    let el = document.getElementById("save-warn");
    if (!on) { el?.remove(); return; }
    if (el) return;
    el = document.createElement("div"); el.id = "save-warn"; el.setAttribute("role", "alert");
    el.textContent = "Your work isn't saving on this device right now. Keep this page open and don't refresh. It will keep trying.";
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:200;background:#6d2318;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)";
    document.body.append(el);
  };
  async function flush() {
    for (const [k, v] of [...pending]) {
      let ok = true;
      try { await once("readwrite", s => s.put(v, k)); } catch { dbp = null; try { await once("readwrite", s => s.put(v, k)); } catch { ok = false; dbp = null; } }
      if (ok && pending.get(k) === v) pending.delete(k);
    }
    warn(pending.size > 0);
  }
  setInterval(() => { if (pending.size) flush(); }, 4000);
  for (const ev of ["online", "pageshow", "focus"]) window.addEventListener(ev, () => { if (pending.size) flush(); });
  document.addEventListener("visibilitychange", () => { if (pending.size) flush(); });
  try { navigator.storage?.persist?.(); } catch {}
  const range = prefix => IDBKeyRange.bound(prefix, prefix + "￿");
  return {
    async get(key) {
      if (mem.has(key)) return mem.get(key);
      if (gone.has(key)) return null;
      const v = await tx("readonly", s => s.get(key));
      if (v !== undefined && v !== null) mem.set(key, v);
      return v ?? null;
    },
    async set(key, val) {
      gone.delete(key); mem.set(key, val);
      let ok = true;
      try { await once("readwrite", s => s.put(val, key)); }
      catch { dbp = null; try { await once("readwrite", s => s.put(val, key)); } catch { ok = false; dbp = null; } }
      if (ok) { if (pending.get(key) === val) pending.delete(key); if (!pending.size) warn(false); }
      else { pending.set(key, val); warn(true); }
    },
    flush,
    async keys(prefix) { return (await this.getAll(prefix)).map(([k]) => k); },
    // every [key, value] whose key starts with prefix
    async getAll(prefix) {
      const [ks, vs] = await Promise.all([
        tx("readonly", s => s.getAllKeys(range(prefix))),
        tx("readonly", s => s.getAll(range(prefix))),
      ]);
      const out = new Map();
      (ks || []).forEach((k, i) => { if (!gone.has(k)) out.set(k, vs[i]); });
      for (const [k, v] of mem) if (k.startsWith(prefix)) out.set(k, v);
      return [...out];
    },
    async del(keys) {
      for (const k of keys) { mem.delete(k); gone.add(k); }
      await tx("readwrite", s => { for (const k of keys) s.delete(k); });
    },
  };
})();

async function firebaseBackend() {
  const cfg = Object.assign({}, window.FIREBASE_CONFIG || {});
  if (!cfg.apiKey || String(cfg.apiKey).includes("PASTE")) throw Object.assign(new Error("not-configured"), { code: "not-configured" });
  // On Firebase Hosting, sign in through this same address (keeps Safari happy).
  if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) cfg.authDomain = location.hostname;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [fa, au, fs] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js"),
  ]);
  const fbApp = fa.initializeApp(cfg);
  const auth = au.getAuth(fbApp);
  // Keep a copy of the exams on this device so they open without internet.
  let db;
  try { db = fs.initializeFirestore(fbApp, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch { db = fs.getFirestore(fbApp); }
  const provider = new au.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  au.getRedirectResult(auth).catch(e => { pendingAuthError = e; showAuthError(e); });

  // Remember, on this device only, that this email was allowed, so a dropped connection doesn't lock the person out.
  // Online checks always win: if you remove someone, the next time they're online the flag is cleared.
  const okKey = email => `mele-ok:${email}`;
  const readOk = email => { try { return localStorage.getItem(okKey(email)); } catch { return null; } };
  const writeOk = (email, v) => { try { v ? localStorage.setItem(okKey(email), v) : localStorage.removeItem(okKey(email)); } catch {} };
  const netErr = e => !e || !e.code || ["unavailable", "deadline-exceeded", "cancelled", "failed-precondition", "internal", "unknown"].includes(e.code) || navigator.onLine === false;
  async function access(user) {
    const email = (user.email || "").toLowerCase();
    let denied = false;
    try { await fs.getDocsFromServer(fs.query(fs.collection(db, "allowed"), fs.limit(1))); writeOk(email, "owner"); return { allowed: true, owner: true }; }
    catch (e) { if (!netErr(e)) denied = true; }
    if (denied) {
      try {
        const snap = await fs.getDocFromServer(fs.doc(db, "allowed", email));
        writeOk(email, snap.exists() ? "ok" : null);
        return { allowed: snap.exists(), owner: false };
      } catch (e) {
        if (!netErr(e)) { writeOk(email, null); return { allowed: false, owner: false }; }
      }
    }
    // couldn't reach the server: fall back to the last online answer
    const mem = readOk(email);
    return { allowed: !!mem, owner: mem === "owner", offline: true };
  }
  return {
    mode: "firebase",
    async start(onState) {
      au.onAuthStateChanged(auth, async user => {
        if (!user) return onState({ user: null });
        onState({ user: { email: user.email, name: user.displayName }, checking: true });
        const a = await access(user);
        onState({ user: { email: user.email, name: user.displayName }, ...a });
      });
    },
    async signIn() {
      try { await au.signInWithPopup(auth, provider); }
      catch (e) {
        if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(e.code)) {
          await au.signInWithRedirect(auth, provider);
        } else if (e.code !== "auth/popup-closed-by-user") throw e;
      }
    },
    signOut: () => au.signOut(auth),
    async listExams() {
      const snap = await fs.getDocs(fs.collection(db, "exams"));
      return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.title.localeCompare(b.title));
    },
    async loadExam(id) {
      const [m, c] = await Promise.all([fs.getDoc(fs.doc(db, "exams", id)), fs.getDoc(fs.doc(db, "examContent", id))]);
      if (!m.exists() || !c.exists()) throw new Error("This exam was removed.");
      return { id, ...m.data(), ...c.data() };
    },
    async listAllowed() {
      const snap = await fs.getDocs(fs.collection(db, "allowed"));
      return snap.docs.map(d => ({ email: d.id, ...d.data() })).sort((a, b) => a.email.localeCompare(b.email));
    },
    async addAllowed(emails) {
      const b = fs.writeBatch(db);
      for (const e of emails) b.set(fs.doc(db, "allowed", e), { addedAt: fs.serverTimestamp() });
      await b.commit();
    },
    removeAllowed: email => fs.deleteDoc(fs.doc(db, "allowed", email)),
    async importExam(x) {
      const meta = { title: x.title, subtitle: x.subtitle || "", sections: x.sections, count: x.questions.length, updatedAt: fs.serverTimestamp() };
      if (SUBJECTS.some(s => s.id === x.subject)) meta.subject = x.subject;
      if (SOURCES.includes(x.source)) meta.source = x.source;
      const b = fs.writeBatch(db);
      b.set(fs.doc(db, "exams", x.id), meta, { merge: true });
      b.set(fs.doc(db, "examContent", x.id), { questions: x.questions });
      await b.commit();
    },
    updateExamMeta: (id, data) => fs.setDoc(fs.doc(db, "exams", id), data, { merge: true }),
    async deleteExam(id) {
      const b = fs.writeBatch(db);
      b.delete(fs.doc(db, "exams", id)); b.delete(fs.doc(db, "examContent", id));
      await b.commit();
    },
  };
}

    const out = {};
    if (typeof t.color === "string" && /^#[0-9a-f]{6}$/i.test(t.color)) out.color = t.color;

  } catch { return {}; }
}

const SUBJECTS = [
  { id: "PIPE", name: "Power & Industrial Plant Engineering" },
  { id: "MD", name: "Machine Design, Materials & Shop Practice" },
  { id: "MESL", name: "Math, Engineering Economics & Basic Sciences" },
];
const SOURCES = ["Prime", "Alcorcon", "Estoque", "Others"];
const UNSORTED = { id: "UNSORTED", name: "Not sorted yet" };
const subjOf = ex => (SUBJECTS.some(s => s.id === ex.subject) ? ex.subject : UNSORTED.id);
const srcOf = ex => (SOURCES.includes(ex.source) ? ex.source : "Others");

const isDone = w => !!(w && (w.choice || w.revealed));
function emptyTally() { return { done: 0, right: 0, wrong: 0 }; }
function addTally(t, w) {
  if (!isDone(w)) return;
  t.done++;
  if (w.ok === true) t.right++;
  else if (w.ok === false) t.wrong++;
}
function sumTally(...ts) {
  const o = emptyTally();
  for (const t of ts) { o.done += t.done; o.right += t.right; o.wrong += t.wrong; }
  return o;
}
// Progress of one problem set, overall and per section, from this device's saved work.
async function examProgress(ex) {
  const prefix = `${userKey()}|${ex.id}|`;
  const all = emptyTally(), bySec = {};
  for (const [k, w] of await store.getAll(prefix)) {
    if (k.endsWith("|~meta")) continue;
    const rest = k.slice(prefix.length), sec = rest.slice(0, rest.lastIndexOf("#"));
    addTally(all, w);
    addTally(bySec[sec] || (bySec[sec] = emptyTally()), w);
  }
  return { all, bySec };
}
function progressView(t, total) {
  const pct = n => (total ? Math.min(100, (n / total) * 100) : 0).toFixed(2) + "%";
  const unchecked = Math.max(0, t.done - t.right - t.wrong);
  const label = `${t.done} of ${total} done` + (t.right || t.wrong ? ` · ${t.right} right · ${t.wrong} wrong` : "");
  const bar = h("span", { class: "pbar", role: "img", "aria-label": label },
    h("i", { class: "p-right", style: `width:${pct(t.right)}` }),
    h("i", { class: "p-wrong", style: `width:${pct(t.wrong)}` }),
    h("i", { class: "p-done", style: `width:${pct(unchecked)}` }));
  const text = h("span", { class: "ptext" },
    h("b", {}, `${t.done}/${total}`), " done",
    t.right || t.wrong ? [" · ", h("span", { class: "t-right" }, `${t.right} right`), " · ", h("span", { class: "t-wrong" }, `${t.wrong} wrong`)] : null);
  return h("div", { class: "pview" }, bar, text);
}

function getPref(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function setPref(k, v) { try { localStorage.setItem(k, v); } catch {} }

  if (!tabs.some(t => t.id === current)) current = (tabs.find(t => exams.some(ex => subjOf(ex) === t.id)) || tabs[0]).id;

  function examCard(ex) {

      h("span", { class: "exam-meta" },
        h("span", { class: "mono" }, `${ex.count} problems`),
        h("span", {}, (ex.sections || []).map(s => s.name).join(" · "))),
      h("div", { class: "card-foot" }, progressView(p.all, ex.count),
        h("button", { class: "btn small on-top", type: "button", "aria-label": `Clear progress of ${ex.title}`, onclick: () => clearScreen(exams, prog, { examId: ex.id }) }, "Clear progress")));
  }

  function renderBrowse() {
    const info = subjInfo(current);
    const inSubj = exams.filter(ex => subjOf(ex) === current);
    const tabRow = h("div", { class: "subject-tabs", role: "tablist", "aria-label": "Subjects" },
      ...tabs.map(t => {
        const n = exams.filter(ex => subjOf(ex) === t.id).length;
        return h("button", { class: "tab", type: "button", role: "tab", "aria-selected": String(t.id === current), title: t.name,
          onclick: () => { current = t.id; setPref("mele-subject", current); renderBrowse(); } },
          t.id === UNSORTED.id ? "Unsorted" : t.id, h("span", { class: "mono" }, String(n)));
      }));

    const tally = sumTally(...inSubj.map(ex => prog.get(ex.id).all));
    const summary = h("section", { class: "summary" },
      h("div", { class: "summary-head" },
        h("div", {}, h("div", { class: "brand" }, current === UNSORTED.id ? "Unsorted" : current), h("h3", {}, info.name)),
        inSubj.length ? h("button", { class: "btn small", type: "button", "aria-label": `Clear progress of ${current}`, onclick: () => clearScreen(exams, prog, { subject: current }) }, "Clear progress") : null),
      inSubj.length ? progressView(tally, total) : h("p", { class: "muted", style: "margin:0" }, "No problem sets in this subject yet."),
      current === UNSORTED.id && S.owner ? h("p", { class: "muted", style: "margin:0;font-size:14px" }, "Set the subject and source of these in Manage (people icon).") : null);
    // source toggle: one source at a time, remembered per subject
    const countIn = src => inSubj.filter(ex => srcOf(ex) === src).length;
    let src = getPref(`mele-source-${current}`, "");
    if (!SOURCES.includes(src)) src = SOURCES.find(x => countIn(x)) || SOURCES[0];
    const srcRow = h("div", { class: "source-toggle", role: "tablist", "aria-label": "Sources" },
      ...SOURCES.map(x => h("button", { class: "seg-btn", type: "button", role: "tab", "aria-selected": String(x === src),
        onclick: () => { setPref(`mele-source-${current}`, x); renderBrowse(); } },
        h("span", {}, x), h("span", { class: "mono" }, String(countIn(x))))));
    const list = inSubj.filter(ex => srcOf(ex) === src);
    const stotal = list.reduce((a, ex) => a + (ex.count || 0), 0);
    const stally = sumTally(...list.map(ex => prog.get(ex.id).all));
    const group = h("section", { class: "source-group" },
      list.length ? h("div", { class: "source-sum" },
        h("div", { class: "source-sum-text" }, h("div", {}, h("b", {}, src), h("span", { class: "muted mono" }, ` · ${list.length} ${list.length === 1 ? "set" : "sets"}`)), progressView(stally, stotal)),
        h("button", { class: "btn small", type: "button", "aria-label": `Clear progress of ${src}`, onclick: () => clearScreen(exams, prog, { subject: current, source: src }) }, "Clear progress"))
        : h("p", { class: "empty" }, `No ${src === "Others" ? "other" : src} problem sets in ${current === UNSORTED.id ? "Unsorted" : current} yet.`),
      list.length ? h("div", { class: "exam-list" }, ...list.map(examCard)) : null);
    browse.replaceChildren(tabRow, summary, inSubj.length ? srcRow : null, inSubj.length ? group : null);
  }
  renderBrowse();

  // search
  let timer, seq = 0;
  async function runSearch() {
    const text = q.value.trim();
    clearQ.classList.toggle("hidden", !text);
    if (!text) { results.classList.add("hidden"); browse.classList.remove("hidden"); return; }
    browse.classList.add("hidden"); results.classList.remove("hidden");
    const my = ++seq;
    if (!S.contentCache) S.contentCache = new Map();
    const missing = exams.filter(ex => !S.contentCache.has(ex.id));
    if (missing.length) {
      results.replaceChildren(h("p", { class: "muted" }, "Searching…"));
      await Promise.all(missing.map(async ex => { try { S.contentCache.set(ex.id, await S.backend.loadExam(ex.id)); } catch {} }));
      if (my !== seq) return;
    }
    renderResults(text);
  }
  function renderResults(text) {
    const tokens = norm(text).split(" ").filter(Boolean);
    const has = s => { const n = norm(s); return tokens.every(t => n.includes(t)); };
    const setHits = exams.filter(ex => has([ex.title, ex.subtitle, subjOf(ex), subjInfo(subjOf(ex)).name, srcOf(ex), ...(ex.sections || []).map(s => s.name)].join(" ")));
    const probHits = [];
    for (const ex of exams) {
      const full = S.contentCache.get(ex.id);
      if (!full) continue;
      for (const qq of full.questions) {
        const hay = [qq.text, ...(qq.notes || []), ...qq.choices.map((c, i) => `${"ABCD"[i]}. ${c}`)].join("  ");
        if (has(hay)) probHits.push({ ex, q: qq, hay });
      }
    }
    const out = [];
    if (setHits.length) out.push(h("h2", {}, "Problem sets"), h("div", { class: "exam-list" }, ...setHits.map(examCard)));
    const LIMIT = 60;
    out.push(h("h2", {}, probHits.length ? `Problems (${probHits.length})` : "Problems"));
    if (!probHits.length) out.push(h("p", { class: "empty" }, "No problems match. Try fewer or different words."));
    for (const { ex, q: qq, hay } of probHits.slice(0, LIMIT)) {
      out.push(h("button", { class: "result", type: "button", onclick: () => openExam(ex.id, { section: qq.section, num: qq.num }) },
        h("span", { class: "result-where" }, `${subjOf(ex) === UNSORTED.id ? "Unsorted" : subjOf(ex)} · ${srcOf(ex)} · ${ex.title} · ${qq.section} `, h("b", {}, `#${qq.num}`)),
        h("span", { class: "result-text", html: snippet(plain(hay), tokens) })));
    }
    if (probHits.length > LIMIT) out.push(h("p", { class: "muted" }, `Showing the first ${LIMIT}. Add more words to narrow it down.`));
    results.replaceChildren(...out);
  }
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(runSearch, 160); });
  clearQ.addEventListener("click", () => { q.value = ""; runSearch(); q.focus(); });
}

function norm(s) { return plain(String(s)).toLowerCase().replace(/[–—]/g, "-").replace(/\s+/g, " ").trim(); }
// Short excerpt around the first match, with every match marked.
function snippet(text, tokens) {
  const low = text.toLowerCase();
  let first = Infinity;
  for (const t of tokens) { const i = low.indexOf(t); if (i >= 0) first = Math.min(first, i); }
  if (first === Infinity) first = 0;
  const W = 220;
  let a = 0, b = text.length;
  if (text.length > W) { a = Math.max(0, first - 70); b = Math.min(text.length, a + W); }
  const seg = text.slice(a, b), sl = seg.toLowerCase(), marks = [];
  for (const t of tokens) { let i = sl.indexOf(t); while (i >= 0 && t) { marks.push([i, i + t.length]); i = sl.indexOf(t, i + t.length); } }
  marks.sort((x, y) => x[0] - y[0]);
  let html = a > 0 ? "… " : "", pos = 0;
  for (const [s, e] of marks) {
    if (e <= pos) continue;
    const st = Math.max(s, pos);
    html += esc(seg.slice(pos, st)) + "<mark>" + esc(seg.slice(st, e)) + "</mark>";
    pos = e;
  }
  html += esc(seg.slice(pos)) + (b < text.length ? " …" : "");
  return html;
}

/* ---------- clear progress ---------- */
async function clearScreen(exams, prog, scope) {
  setWatermark(null);
  // tree: subject > source > set > section; leaves are "examId\u0001section"
  const leafId = (ex, sec) => `${ex.id}\u0001${sec}`;
  const tree = [];
  for (const sj of [...SUBJECTS, UNSORTED]) {
    const inS = exams.filter(ex => subjOf(ex) === sj.id);
    if (!inS.length) continue;
    const sNode = { label: sj.id === UNSORTED.id ? "Unsorted" : `${sj.id} · ${sj.name}`, children: [] };
    for (const src of SOURCES) {
      const inSrc = inS.filter(ex => srcOf(ex) === src).sort(byTitle);
      if (!inSrc.length) continue;
      const srcNode = { label: src, children: [] };
      for (const ex of inSrc) {
        const p = prog.get(ex.id);
        srcNode.children.push({ label: ex.title, tally: p.all, total: ex.count,
          children: (ex.sections || []).map(s => ({ label: s.name, leaf: leafId(ex, s.name), ex, sec: s.name, tally: p.bySec[s.name] || emptyTally(), total: s.count })) });
      }
      sNode.children.push(srcNode);
    }
    tree.push(sNode);
  }
  const leavesOf = n => n.leaf ? [n.leaf] : n.children.flatMap(leavesOf);
  const tallyOf = n => n.leaf || n.tally ? (n.tally || emptyTally()) : sumTally(...n.children.map(tallyOf));
  const totalOf = n => n.total ?? n.children.reduce((a, c) => a + totalOf(c), 0);
  const chosen = new Set();
  if (scope) {
    for (const ex of exams) {
      if (scope.examId && ex.id !== scope.examId) continue;
      if (scope.subject && subjOf(ex) !== scope.subject) continue;
      if (scope.source && srcOf(ex) !== scope.source) continue;
      for (const s of ex.sections || []) chosen.add(leafId(ex, s.name));
    }
  }
  const allLeaves = tree.flatMap(leavesOf);

  const box = h("div", { class: "ctree" });
  const erase = h("input", { type: "checkbox", id: "erase-solutions" });
  const clearBtn = h("button", { class: "btn danger", type: "button" }, "Clear selected");
  const status = h("span", { class: "muted", style: "font-size:14px" });

  function row(node, depth, idx) {
    const leaves = leavesOf(node), n = leaves.filter(l => chosen.has(l)).length;
    const cb = h("input", { type: "checkbox", id: `ct-${depth}-${idx}` });
    cb.checked = n === leaves.length && n > 0; cb.indeterminate = n > 0 && n < leaves.length;
    cb.addEventListener("change", () => {
      const all = leaves.every(l => chosen.has(l));
      leaves.forEach(l => all ? chosen.delete(l) : chosen.add(l));
      render();
    });
    const t = tallyOf(node), tot = totalOf(node);
    return h("label", { class: "ct-row", "data-depth": String(depth), for: cb.id }, cb,
      h("span", { class: "grow" }, node.label), h("span", { class: "ct-count mono" }, `${t.done}/${tot}`));
  }
  function render() {
    let i = 0;
    const rows = [];
    const allCb = h("input", { type: "checkbox", id: "ct-all" });
    allCb.checked = chosen.size === allLeaves.length && allLeaves.length > 0;
    allCb.indeterminate = chosen.size > 0 && chosen.size < allLeaves.length;
    allCb.addEventListener("change", () => { const all = chosen.size === allLeaves.length; allLeaves.forEach(l => all ? chosen.delete(l) : chosen.add(l)); render(); });
    rows.push(h("label", { class: "ct-row ct-all", "data-depth": "0", for: "ct-all" }, allCb, h("span", { class: "grow" }, "Select all"),
      h("span", { class: "ct-count mono" }, `${sumTally(...tree.map(tallyOf)).done}/${tree.reduce((a, n) => a + totalOf(n), 0)}`)));
    const walk = (node, d) => { rows.push(row(node, d, i++)); if (!node.leaf) node.children.forEach(c => walk(c, d + 1)); };
    tree.forEach(n => walk(n, 0));
    box.replaceChildren(...rows);
    clearBtn.disabled = chosen.size === 0;
    status.textContent = chosen.size ? `${chosen.size} ${chosen.size === 1 ? "section" : "sections"} selected` : "Nothing selected";
  }
  render();

  armed(clearBtn, "Clear selected", async () => {
    const eraseAll = erase.checked;
    const pick = [...chosen].map(l => { const [id, sec] = l.split("\u0001"); return { id, sec }; });
    for (const { id, sec } of pick) {
      const entries = await store.getAll(`${userKey()}|${id}|${sec}#`);
      const dels = [];
      for (const [k, w] of entries) {
        if (eraseAll || !((w.strokes && w.strokes.length) || w.text)) dels.push(k);
        else await store.set(k, Object.assign({}, w, { choice: null, revealed: false, ok: null }));
      }
      if (dels.length) await store.del(dels);
    }
    if (eraseAll) {
      for (const ex of exams) {
        if ((ex.sections || []).every(s => chosen.has(leafId(ex, s.name)))) await store.del([metaKey(ex.id)]);
      }
    }
    toast(eraseAll ? "Progress and solutions cleared" : "Progress cleared");
    homeScreen();
  });

  screen(topbar({ title: "Clear progress", sub: "Pick what to reset", onBack: homeScreen }),
    h("main", { class: "home" },
      h("p", { class: "muted", style: "margin:0" }, "Tick the subjects, sources, problem sets or sections to reset. The numbers show problems done. This only changes your progress on this device."),
      box,
      h("label", { class: "opt-row", for: "erase-solutions" }, erase, h("span", {}, h("b", {}, "Also erase my written solutions and typed notes"), h("br"), h("span", { class: "muted", style: "font-size:14px" }, "Leave this off to keep your work and reset only the answers you picked and checked."))),
      h("div", { class: "clear-actions" }, clearBtn, status)));
}

/* ---------- admin (owner only) ---------- */
async function adminScreen() {
  const emailBox = h("textarea", { id: "new-emails", placeholder: "name@gmail.com, another@gmail.com", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
  const addBtn = h("button", { class: "btn primary", type: "button" }, "Add emails");
  const people = h("div", { class: "rows" }, h("div", { class: "empty" }, "Loading…"));
  const exams = h("div", { class: "rows" }, h("div", { class: "empty" }, "Loading…"));
  const fileInput = h("input", { type: "file", id: "exam-file", accept: ".json,application/json" });
  const importBtn = h("label", { class: "btn file-btn", for: "exam-file" }, "Import exam file (.json)", fileInput);
  const count = h("span", { class: "muted" });

  async function loadPeople() {
    const list = await S.backend.listAllowed();
    count.textContent = `${list.length} ${list.length === 1 ? "person" : "people"}`;
    people.replaceChildren(...(list.length ? list.map(p => {
      const rm = h("button", { class: "btn small danger", type: "button" }, "Remove");
      armed(rm, "Remove", async () => { await S.backend.removeAllowed(p.email); toast(`Removed ${p.email}`); loadPeople(); });
      return h("div", { class: "row" }, h("span", { class: "grow" }, p.email), rm);
    }) : [h("div", { class: "empty" }, "Nobody yet. Only you can open the problem sets.")]));
  }
  async function loadExams() {
    const list = await S.backend.listExams();
    list.sort(byTitle);
    exams.replaceChildren(...(list.length ? list.map(x => {
      const del = h("button", { class: "btn small danger", type: "button" }, "Delete");
      armed(del, "Delete", async () => { await S.backend.deleteExam(x.id); S.contentCache?.delete(x.id); toast(`Deleted ${x.title}`); loadExams(); });
      const subjSel = h("select", { id: `subj-${x.id}`, "aria-label": `Subject of ${x.title}` },
        h("option", { value: "", selected: subjOf(x) === UNSORTED.id }, "Choose…"),
        ...SUBJECTS.map(sj => h("option", { value: sj.id, selected: x.subject === sj.id }, sj.id)));
      const srcSel = h("select", { id: `src-${x.id}`, "aria-label": `Source of ${x.title}` },
        ...SOURCES.map(src => h("option", { value: src, selected: srcOf(x) === src }, src)));
      const saveMeta = async () => {
        const data = { source: srcSel.value };
        if (subjSel.value) data.subject = subjSel.value;
        try { await S.backend.updateExamMeta(x.id, data); toast(`Saved: ${x.title} → ${subjSel.value || "Unsorted"} · ${srcSel.value}`); }
        catch { toast("Couldn't save. Check your connection."); }
      };
      subjSel.addEventListener("change", saveMeta);
      srcSel.addEventListener("change", saveMeta);
      const nameIn = h("input", { type: "text", id: `name-${x.id}`, class: "rename-in", value: x.title, maxlength: "120", autocomplete: "off", "aria-label": `New name for ${x.title}` });
      const renBtn = h("button", { class: "btn small", type: "button" }, "Rename");
      const doRename = async () => {
        const t = nameIn.value.trim().replace(/\s+/g, " ");
        if (!t) { toast("Type a name first."); nameIn.value = x.title; return; }
        if (t === x.title) { toast("That's already the name."); return; }
        renBtn.disabled = true;
        try { await S.backend.updateExamMeta(x.id, { title: t }); toast(`Renamed to ${t}`); loadExams(); }
        catch { toast("Couldn't save. Check your connection."); renBtn.disabled = false; }
      };
      renBtn.addEventListener("click", doRename);
      nameIn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); doRename(); } });
      return h("div", { class: "admin-exam" },
        h("div", { class: "admin-exam-top" }, h("span", { class: "grow" }, x.title, h("small", { class: "mono" }, `${x.count} problems · id ${x.id}`)), del),
        h("div", { class: "rename-row" }, nameIn, renBtn),
        h("div", { class: "admin-exam-sel" }, h("label", { for: subjSel.id }, "Subject", subjSel), h("label", { for: srcSel.id }, "Source", srcSel)));
    }) : [h("div", { class: "empty" }, "No exams yet. Import the .json file I gave you.")]));
  }
  addBtn.addEventListener("click", async () => {
    const raw = emailBox.value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
    const good = raw.filter(e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
    const bad = raw.filter(e => !good.includes(e));
    if (!good.length) { toast(bad.length ? `Not an email: ${bad[0]}` : "Type at least one email."); return; }
    addBtn.disabled = true;
    try { await S.backend.addAllowed([...new Set(good)]); emailBox.value = bad.join(", "); toast(`Added ${good.length}${bad.length ? `, skipped ${bad.length} that aren't emails` : ""}`); await loadPeople(); }
    catch (e) { toast("Couldn't save. Check that the Firestore rules are published."); }
    finally { addBtn.disabled = false; }
  });
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files[0]; fileInput.value = "";
    if (!f) return;
    try {
      const x = JSON.parse(await f.text());
      if (x.format !== "exam-viewer/1" || !x.id || !Array.isArray(x.questions) || !x.questions.length) throw new Error("bad");
      if (new Blob([JSON.stringify(x.questions)]).size > 900000) { toast("That exam is too big for one file. Split it in two."); return; }
      await S.backend.importExam(x);
      S.contentCache?.delete(x.id);
      toast(`Imported ${x.title} (${x.questions.length} problems)`);
      loadExams();
    } catch (e) { toast(e.message === "bad" ? "That isn't an exam file from this app." : "Import failed. Check that the Firestore rules are published."); }
  });

  screen(topbar({ title: "Manage", sub: "Who can open the problem sets", onBack: homeScreen }),
    h("main", { class: "home" },
      h("section", { class: "admin-block" },
        h("h3", {}, "People with access ", count),
        h("p", { class: "muted", style: "margin:0;font-size:14px" }, "Add the Google account email of each person. They sign in with that account. Remove someone and they lose access right away."),
        emailBox, h("div", {}, addBtn), people),
      h("section", { class: "admin-block" },
        h("h3", {}, "Exams"),
        h("p", { class: "muted", style: "margin:0;font-size:14px" }, "Importing a file with the same id replaces that exam. People's own drawings stay on their devices. Choose each exam's subject and source here; it saves as soon as you change it."),
        h("div", {}, importBtn), exams)));
  setWatermark(null);
  loadPeople().catch(() => people.replaceChildren(h("div", { class: "err-box" }, "Couldn't load the list. Are the Firestore rules published?")));
  loadExams().catch(() => exams.replaceChildren(h("div", { class: "err-box" }, "Couldn't load exams.")));
}

/* ---------- exam view ---------- */
function buildPages(exam) {
  const pages = [];
  let cur = null;
  exam.questions.forEach((q, i) => {
    if (!cur || cur.section !== q.section || cur.idx.length === 2) { cur = { section: q.section, idx: [] }; pages.push(cur); }
    cur.idx.push(i);
  });
  return pages;
}

async function openExam(id, target) {
  messageScreen("Opening…", h("p", { class: "muted" }, "Loading the problems."));
  try {
    S.exam = (S.contentCache && S.contentCache.get(id)) || await S.backend.loadExam(id);
  } catch (e) {
    messageScreen("Couldn't open this problem set", h("p", { class: "muted" }, e.message || "Check your connection and try again."),
      [h("button", { class: "btn", type: "button", onclick: homeScreen }, "Back")]);
    return;
  }
  S.pages = buildPages(S.exam);
  // this device's saved work for every problem, for the progress bar
  const prefix = `${userKey()}|${S.exam.id}|`;
  S.progress = new Map();
  for (const [k, w] of await store.getAll(prefix)) if (!k.endsWith("|~meta")) S.progress.set(k.slice(prefix.length), w);
  const meta = await store.get(metaKey(S.exam.id));
  S.pageIndex = Math.min(meta?.page ?? 0, S.pages.length - 1);
  S.jumpTo = null;
  if (target) {
    const qi = S.exam.questions.findIndex(x => x.section === target.section && x.num === target.num);
    const pi = S.pages.findIndex(p => p.idx.includes(qi));
    if (pi >= 0) { S.pageIndex = pi; S.jumpTo = `${target.section}#${target.num}`; }
  }
  renderExam();
}

function pageLabel(p, i) {
  const qs = p.idx.map(j => S.exam.questions[j].num);
  return `Page ${i + 1} · ${p.section} ${qs.length > 1 ? `${qs[0]}–${qs[qs.length - 1]}` : qs[0]}`;
}

// Tally from the exam's own answer key, so "right" and "wrong" are always current.
function examTally(section) {
  const t = emptyTally();
  for (const q of S.exam.questions) {
    if (section && q.section !== section) continue;
    const w = S.progress.get(qKey(q));
    if (!isDone(w)) continue;
    t.done++;
    if (w.revealed && w.choice) { if (w.choice === q.answer) t.right++; else t.wrong++; }
  }
  return t;
}
function updateExamProgress() {
  const box = document.getElementById("exam-progress");
  if (!box || !S.exam) return;
  box.replaceChildren(progressView(examTally(null), S.exam.questions.length));
  for (const chip of document.querySelectorAll(".sections .chip")) {
    const s = (S.exam.sections || []).find(x => x.name === chip.dataset.section);
    if (s) chip.querySelector(".mono").textContent = `${examTally(s.name).done}/${s.count}`;
  }
}

function renderExam() {
  const ex = S.exam;
  const page = S.pages[S.pageIndex];
  setWatermark(S.backend.mode === "preview" ? "PREVIEW" : S.user.email);
  store.set(metaKey(ex.id), { page: S.pageIndex });

  const header = topbar({ title: ex.title, sub: pageLabel(page, S.pageIndex), onBack: homeScreen });
  header.append(toolButtons());

  const firstPageOf = name => S.pages.findIndex(p => p.section === name);
  const chips = h("nav", { class: "sections", "aria-label": "Sections" },
    ...(ex.sections || []).map(s => h("button", { class: "chip", type: "button", "data-section": s.name, "aria-current": String(s.name === page.section), onclick: () => go(firstPageOf(s.name)) },
      s.name, h("span", { class: "mono" }, String(s.count)))));
  const progress = h("div", { class: "exam-progress", id: "exam-progress" });

  const main = h("main", { class: "page" });
  const select = h("select", { id: "page-select", "aria-label": "Go to page" },
    ...S.pages.map((p, i) => h("option", { value: String(i), selected: i === S.pageIndex }, pageLabel(p, i))));
  select.addEventListener("change", () => go(Number(select.value)));
  const prev = h("button", { class: "btn", type: "button", disabled: S.pageIndex === 0, onclick: () => go(S.pageIndex - 1) }, "Prev");
  const next = h("button", { class: "btn primary", type: "button", disabled: S.pageIndex === S.pages.length - 1, onclick: () => go(S.pageIndex + 1) }, "Next");
  const pager = h("nav", { class: "pager", "aria-label": "Pages" }, h("div", { class: "pager-row" }, prev, select, next));

  screen(header, chips, progress, main, pager);
  const setTop = () => document.documentElement.style.setProperty("--topbar-h", header.offsetHeight + "px");
  setTop();
  if (window.ResizeObserver) { S.ro?.disconnect(); S.ro = new ResizeObserver(setTop); S.ro.observe(header); }
  for (const i of page.idx) main.append(problemCard(ex, ex.questions[i]));
  updateExamProgress();
  const cur = chips.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
  if (S.jumpTo) {
    const card = main.querySelector(`[data-key="${CSS.escape(S.jumpTo)}"]`);
    S.jumpTo = null;
    if (card) {
      const top = card.getBoundingClientRect().top + window.scrollY - header.offsetHeight - 12;
      window.scrollTo(0, Math.max(0, top));
      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 1800);
    }
  }
}

function toolButtons() {

      seg.append(mk(label, t.selMode === m, `${icon}<span class="tool-label">${short}</span>`, () => { t.selMode = m; changed(); }));
    }

    toast(t.finger ? "Your finger now writes on the pads. Scroll outside the pads." : "Your finger scrolls. A stylus or mouse still writes.");
  }));

}

function go(i) {
  if (i < 0 || i >= S.pages.length || i === S.pageIndex) return;
  S.pageIndex = i; renderExam();
}
document.addEventListener("keydown", e => {
  if ((e.key === "Delete" || e.key === "Backspace") && !inEditable(e.target)) { const p = S.pads.find(x => x.sel); if (p) { e.preventDefault(); p.deleteSel(); return; } }
  if (!S.exam || !document.querySelector(".pager") || inEditable(e.target) || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(S.pageIndex + 1);
  if (e.key === "ArrowLeft") go(S.pageIndex - 1);
});

function problemCard(ex, q) {
  const key = workKey(ex.id, q);
  let work = { strokes: [], h: 0.75, choice: null, revealed: false, text: "" };
  const save = () => {
    work.ok = work.revealed && work.choice ? work.choice === q.answer : null;
    store.set(key, work);
    if (S.progress && S.exam === ex) { S.progress.set(qKey(q), work); updateExamProgress(); }
  };
  const letters = ["A", "B", "C", "D"];
  const long = q.choices.some(c => plain(c).length > 34);

  const choiceBtns = q.choices.map((c, i) => h("button", { class: "choice", type: "button", "aria-pressed": "false", "data-letter": letters[i] },
    h("span", { class: "letter" }, letters[i]), h("span", { html: rich(c) })));
  const answerTag = h("span", { class: "answer-tag hidden" }, `Answer: ${q.answer}`);
  const verdict = h("span", { class: "verdict" });
  const revealBtn = h("button", { class: "btn small", type: "button" }, "Show answer");

  function paint() {
    choiceBtns.forEach(b => {
      const L = b.dataset.letter;
      b.setAttribute("aria-pressed", String(work.choice === L));
      b.classList.toggle("is-correct", work.revealed && L === q.answer);
      b.classList.toggle("is-wrong", work.revealed && work.choice === L && L !== q.answer);
    });
    answerTag.classList.toggle("hidden", !work.revealed);
    revealBtn.textContent = work.revealed ? "Hide answer" : "Show answer";
    verdict.className = "verdict";
    verdict.textContent = "";
    if (work.revealed && work.choice) {
      const ok = work.choice === q.answer;
      verdict.classList.add(ok ? "good" : "bad");
      verdict.textContent = ok ? "You got it." : `You picked ${work.choice}.`;
    }
  }
  choiceBtns.forEach(b => b.addEventListener("click", () => { work.choice = work.choice === b.dataset.letter ? null : b.dataset.letter; paint(); save(); }));
  revealBtn.addEventListener("click", () => { work.revealed = !work.revealed; paint(); save(); });

  // solution pad
  const padEl = h("div", { class: "pad" });
  const hint = h("span", { class: "pad-hint" }, "Write your solution here");
  padEl.append(hint);
  const undo = h("button", { class: "btn small", type: "button" }, "Undo");
  const redo = h("button", { class: "btn small", type: "button" }, "Redo");
  const more = h("button", { class: "btn small", type: "button" }, "More space");
  const clear = h("button", { class: "btn small danger", type: "button" }, "Clear");
  const ta = h("textarea", { id: `typed-${q.section.replace(/\W+/g, "-")}-${q.num}`, placeholder: "Type your solution or notes" });
  const typed = h("details", { class: "typed" }, h("summary", {}, "Type instead"), ta);

  const pinBtn = h("button", { class: "pin-btn", type: "button", "aria-pressed": "false", title: "Keep this question on screen while you scroll to write", "aria-label": `Lock problem ${q.num} in view`, html: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></svg><span>Lock</span>` });
  const stick = h("div", { class: "q-stick" },
    h("div", { class: "problem-head" }, h("span", { class: "qnum" }, String(q.num)), h("span", { class: "qsec" }, q.section), pinBtn),
    h("div", { class: "qtext", html: rich(q.text) }),
    ...(q.notes || []).map(n => h("div", { class: "qnote", html: rich(n) })),
    h("div", { class: `choices${long ? " long" : ""}` }, ...choiceBtns),
    h("div", { class: "answer-row" }, revealBtn, answerTag, verdict));
  pinBtn.addEventListener("click", () => {
    const on = !stick.classList.contains("pinned");
    document.querySelectorAll(".q-stick.pinned").forEach(el => el.classList.remove("pinned"));
    document.querySelectorAll(".pin-btn").forEach(b => { b.setAttribute("aria-pressed", "false"); b.querySelector("span").textContent = "Lock"; });
    if (on) { stick.classList.add("pinned"); pinBtn.setAttribute("aria-pressed", "true"); pinBtn.querySelector("span").textContent = "Locked"; }
    toast(on ? "Question locked. It stays at the top while you write." : "Question unlocked.");
  });

  const card = h("article", { class: "problem", "aria-label": `Problem ${q.num}`, "data-key": qKey(q) },
    stick,
    h("div", { class: "pad-wrap" },
      h("div", { class: "pad-label" }, h("b", {}, "Solution"), h("span", { class: "pad-actions" }, undo, redo, more, clear)),
      padEl, typed));

  const pad = new Pad(padEl, () => work, () => { hint.classList.toggle("hidden", work.strokes.length > 0); save(); });
  S.pads.push(pad);
  undo.addEventListener("click", () => pad.undo());
  redo.addEventListener("click", () => pad.redo());
  more.addEventListener("click", () => { work.h = Math.min(3, +(work.h + 0.4).toFixed(2)); pad.resize(true); save(); toast("Added more writing space"); });
  armed(clear, "Clear", async () => { pad.clearAll(); work.h = 0.75; pad.resize(true); hint.classList.remove("hidden"); save(); });
  let tt;
  ta.addEventListener("input", () => { work.text = ta.value; save(); });

  store.get(key).then(v => {
    if (v) work = Object.assign(work, v);
    ta.value = work.text || "";
    if (work.text) typed.open = true;
    hint.classList.toggle("hidden", work.strokes.length > 0);
    paint(); pad.resize(true);
  });
  paint();
  return card;
}

/* ---------- geometry helpers (units: 1/10000 of the pad width) ---------- */
const hyp = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return hyp(px, py, ax + t * dx, ay + t * dy);
}
function pathLen(p) { let L = 0; for (let i = 2; i < p.length; i += 2) L += hyp(p[i - 2], p[i - 1], p[i], p[i + 1]); return L; }
function bboxOf(p) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); }
  return { x0, y0, x1, y1 };
}
function densify(p, step) {
  const o = [p[0], p[1]];
  for (let i = 2; i < p.length; i += 2) {
    const px = p[i - 2], py = p[i - 1], dx = p[i] - px, dy = p[i + 1] - py, d = Math.hypot(dx, dy);
    if (d > step) { const k = Math.ceil(d / step); for (let j = 1; j < k; j++) o.push(px + dx * j / k, py + dy * j / k); }
    o.push(p[i], p[i + 1]);
  }
  return o;
}
function pip(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
    const xi = poly[i], yi = poly[i + 1], xj = poly[j], yj = poly[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/* ---------- shape recognition ----------
   Takes a hand-drawn stroke and returns a clean line, ellipse, triangle or
   rectangle, or null when the stroke doesn't look like one. */
function dp(pts, tol) {
  if (pts.length < 3) return pts.slice();
  const a = pts[0], b = pts[pts.length - 1];
  let md = -1, mi = -1;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = segDist(pts[i][0], pts[i][1], a[0], a[1], b[0], b[1]);
    if (d > md) { md = d; mi = i; }
  }
  if (md > tol) return dp(pts.slice(0, mi + 1), tol).slice(0, -1).concat(dp(pts.slice(mi), tol));
  return [a, b];
}
function turnAngle(a, b, c) {
  const ux = b[0] - a[0], uy = b[1] - a[1], vx = c[0] - b[0], vy = c[1] - b[1];
  const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
  if (!lu || !lv) return 0;
  return Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv)))) * 180 / Math.PI;
}
function cleanPoly(v, diag) {
  let changed = true;
  while (changed && v.length > 3) {
    changed = false;
    for (let i = 0; i < v.length; i++) {
      const prev = v[(i + v.length - 1) % v.length], cur = v[i], next = v[(i + 1) % v.length];
      if (turnAngle(prev, cur, next) < 22 || hyp(cur[0], cur[1], prev[0], prev[1]) < 0.08 * diag) { v.splice(i, 1); changed = true; break; }
    }
  }
  return v;
}
function recognizeShape(p) {
  const n = p.length / 2;
  if (n < 6) return null;
  const L = pathLen(p), bb = bboxOf(p);
  const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0, diag = Math.hypot(w, h);
  if (L < 500 || diag < 350) return null;
  const sx = p[0], sy = p[1], ex = p[p.length - 2], ey = p[p.length - 1];
  const gap = hyp(sx, sy, ex, ey);
  if (gap > 0.2 * L) {
    // open stroke: only a straight line qualifies
    let dev = 0;
    for (let i = 0; i < n; i++) dev = Math.max(dev, segDist(p[2 * i], p[2 * i + 1], sx, sy, ex, ey));
    if (dev < 0.06 * gap && L < 1.2 * gap) return { kind: "line", p: [sx, sy, ex, ey] };
    return null;
  }
  // closed stroke: ellipse first, then polygons
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, a = w / 2, b = h / 2;
  if (a > 80 && b > 80) {
    let sum = 0;
    for (let i = 0; i < n; i++) sum += Math.abs(Math.hypot((p[2 * i] - cx) / a, (p[2 * i + 1] - cy) / b) - 1);
    if (sum / n < 0.09) {
      let rx = a, ry = b;
      if (Math.abs(a - b) < 0.15 * Math.max(a, b)) rx = ry = (a + b) / 2;
      const o = [];
      for (let i = 0; i <= 72; i++) { const t = i / 72 * Math.PI * 2; o.push(cx + rx * Math.cos(t), cy + ry * Math.sin(t)); }
      return { kind: rx === ry ? "circle" : "ellipse", p: o };
    }
  }
  const pts = [];
  for (let i = 0; i < n; i++) pts.push([p[2 * i], p[2 * i + 1]]);
  let mi = 0, md = -1;
  for (let i = 1; i < pts.length; i++) { const d = hyp(pts[i][0], pts[i][1], pts[0][0], pts[0][1]); if (d > md) { md = d; mi = i; } }
  const left = dp(pts.slice(0, mi + 1), 0.05 * diag), right = dp(pts.slice(mi).concat([pts[0]]), 0.05 * diag);
  const verts = cleanPoly(left.slice(0, -1).concat(right.slice(0, -1)), diag);
  const close = v => { const o = []; for (const q of v) o.push(q[0], q[1]); o.push(v[0][0], v[0][1]); return o; };
  if (verts.length === 3) return { kind: "triangle", p: close(verts) };
  if (verts.length === 4) {
    const rightAngles = verts.every((c, i) => {
